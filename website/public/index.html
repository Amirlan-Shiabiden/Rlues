<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rlues — записи</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Rlues</h1>
    <span id="db-status" class="badge">БД: проверка…</span>
  </header>

  <main>
    <section class="card">
      <h2>Новый пользователь</h2>
      <form id="user-form">
        <input name="name" placeholder="Имя" required maxlength="100">
        <input name="email" type="email" placeholder="Email" required maxlength="255">
        <button>Добавить</button>
      </form>
      <ul id="users"></ul>
    </section>

    <section class="card">
      <h2>Новая запись</h2>
      <form id="post-form">
        <select name="user_id" required></select>
        <input name="title" placeholder="Заголовок" required maxlength="200">
        <textarea name="body" placeholder="Текст" rows="3"></textarea>
        <button>Опубликовать</button>
      </form>
    </section>

    <section>
      <h2>Записи</h2>
      <div id="posts"></div>
    </section>
  </main>

  <p id="error" class="error" hidden></p>
  <script src="app.js"></script>
</body>
</html>
