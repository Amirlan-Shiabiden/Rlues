services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: rlues
      POSTGRES_PASSWORD: rlues
      POSTGRES_DB: rlues
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rlues -d rlues"]
      interval: 5s
      retries: 10

  app:
    build: .
    environment:
      DATABASE_URL: postgres://rlues:rlues@db:5432/rlues
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "npm run migrate && npm start"

volumes:
  pgdata:
